services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: usagebill
      POSTGRES_PASSWORD: usagebill
      POSTGRES_DB: usagebill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usagebill -d usagebill"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
