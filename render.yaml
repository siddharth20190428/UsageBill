# Render Blueprint: one Docker web service (API + UI). The database is external (see docs/deploy.md).
services:
  - type: web
    name: usagebill
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard; never commit it
