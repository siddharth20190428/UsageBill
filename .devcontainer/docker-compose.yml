services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    # Share the db container's network so "localhost:5432" reaches Postgres.
    network_mode: service:db
    command: sleep infinity

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: usagebill
      POSTGRES_PASSWORD: usagebill
      POSTGRES_DB: usagebill
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ../scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
